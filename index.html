<body>

<div class="reloj" aria-hidden="true">
  <span class="reloj-linea">
    <span class="punto"></span>
    <span class="hora" id="hora">--:--:--</span>
  </span>
  <span class="zona" id="zona"></span>
</div>

<main class="escena">
  <h1 class="nombre">Alejandro Ortega</h1>
</main>

<footer class="pie">
  <p>© <span id="anio">2026</span> Alejandro Ortega</p>
</footer>

<script>
  const ZONA_HORARIA = 'America/Bogota';
  const CIUDAD = 'BOGOTÁ';

  document.getElementById('anio').textContent = new Date().getFullYear();

  const elHora = document.getElementById('hora');
  const elZona = document.getElementById('zona');

  const formato = new Intl.DateTimeFormat('es-CO', {
    timeZone: ZONA_HORARIA, hour: '2-digit', minute: '2-digit',
    second: '2-digit', hour12: true
  });

  function desfase() {
    const ahora = new Date();
    const local = new Date(ahora.toLocaleString('en-US', { timeZone: ZONA_HORARIA }));
    const utc = new Date(ahora.toLocaleString('en-US', { timeZone: 'UTC' }));
    const h = Math.round((local - utc) / 3600000);
    return 'GMT' + (h >= 0 ? '+' : '') + h;
  }

  function tic() {
    elHora.textContent = formato.format(new Date()).toUpperCase();
  }

  elZona.textContent = '(' + desfase() + ') ' + CIUDAD;
  tic();
  setInterval(tic, 1000);
</script>
